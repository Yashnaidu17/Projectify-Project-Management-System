services:
  - type: web
    name: projectify-backend
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install && node_modules/.bin/prisma.cmd generate
    startCommand: npm run build && npm start
    rootDir: backend
    envVars:
      - key: PORT
        value: 5000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
